    body {

        .checkout{
            width:100%;
            min-height: 100%;
        }
        .checkoutCenterWap{
            width:300px;
            height:260px;
            background: rgba(255, 255, 255, 0.5);
            position: absolute;
            top:100px;
            left:50%;
            padding:10px 0;
            margin-left:-150px;
            text-align: center;
            border-radius: 4px;



        }
        .loadingWapC {
display: block;
position: absolute;
top: 0;
left: 0;
background: none;
z-index: 1000;
width: 100%;
height: 100%;
}

        .loadingWapC span {
line-height: 100px;
border-radius: 50%;
text-align: center;
background: #FFF;
margin: 0;
color: #555;
width: 100px;
height: 100px;
position: absolute;
left: 50%;
top: 150px;
margin-left: -50px;
margin-top: -50px;
box-shadow: 0px 0px 20px 0px #808080;
-webkit-animation: loading 2s ease infinite;
background: #FFF url(img/cab.png) no-repeat;
background-size: 50px;
background-position: 24px 27px;
z-index: 1001;
}

@-webkit-keyframes loading {
  50% {
    box-shadow: 0px 0px 20px 0px gray, inset 0px 0px 0px 3px #f8da15, inset 0px 0px 0px 6px #f9e247, inset 0px 0px 0px 9px #fbea78, inset 0px 0px 0px 12px #fcf1aa, inset 0px 0px 0px 15px #fef9db;
  }
}

@-moz-keyframes loading {
  50% {
    box-shadow: 0px 0px 20px 0px gray, inset 0px 0px 0px 3px #f8da15, inset 0px 0px 0px 6px #f9e247, inset 0px 0px 0px 9px #fbea78, inset 0px 0px 0px 12px #fcf1aa, inset 0px 0px 0px 15px #fef9db;
  }
}

@-ms-keyframes loading {
  50% {
    box-shadow: 0px 0px 20px 0px gray, inset 0px 0px 0px 3px #f8da15, inset 0px 0px 0px 6px #f9e247, inset 0px 0px 0px 9px #fbea78, inset 0px 0px 0px 12px #fcf1aa, inset 0px 0px 0px 15px #fef9db;
  }
}

@keyframes loading {
  50% {
    box-shadow: 0px 0px 20px 0px gray, inset 0px 0px 0px 3px #f8da15, inset 0px 0px 0px 6px #f9e247, inset 0px 0px 0px 9px #fbea78, inset 0px 0px 0px 12px #fcf1aa, inset 0px 0px 0px 15px #fef9db;
  }
}
.loadingWapC span:after{

            content:attr(data-text);
            top: 120px;

            color: #1e1e1e;

            width: 280px;
            line-height: 24px;
            text-align: center;
        
}
